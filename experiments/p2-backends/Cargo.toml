[workspace]
members = ["common", "burn-cubecl", "candle", "cudarc-fallback"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"
publish = false

[workspace.dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
candle-core = { version = "=0.11.0", default-features = false }
cudarc = { version = "=0.19.8", default-features = false }
half = { version = "=2.7.1", default-features = false, features = ["std"] }
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
