[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
base64 = "0.22"
tempfile = "3.23"
tree-sitter = "=0.25.8"
tree-sitter-python = "=0.25.0"
