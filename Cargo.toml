[workspace]
members = [".", "xtask"]
resolver = "3"

[package]
name = "rust-llm-pretrain"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Zero-Python Rust scaffold for the python-slm rebuild"
license = "Apache-2.0 OR MIT"

[[bin]]
name = "python-slm"
path = "src/main.rs"

[features]
default = ["cpu-reference"]
# The CPU feature is intentionally dependency-free until its owning phases land.
cpu-reference = []
# The P2/P10 accelerator boundary; P18 reuses it for the Linux/NVIDIA lane.
cuda = [
    "dep:anyhow",
    "dep:burn",
    "dep:burn-autodiff",
    "burn/cuda",
    "burn/autodiff",
    "burn/fusion",
    "burn/autotune",
    "dep:half",
]
# P18 Linux/AMD ROCm/HIP adapter boundary; compiles only where the HIP SDK exists.
rocm = [
    "dep:anyhow",
    "dep:burn",
    "dep:burn-autodiff",
    "burn/rocm",
    "burn/autodiff",
    "burn/fusion",
    "burn/autotune",
    "dep:half",
]
# P18 macOS/Apple Silicon Metal adapter boundary; compiles only on macOS hosts.
metal = [
    "dep:anyhow",
    "dep:burn",
    "dep:burn-autodiff",
    "burn/metal",
    "burn/autodiff",
    "burn/fusion",
    "burn/autotune",
    "dep:half",
]

[dependencies]
# `DECONTAM-001` asks whether any of a thousand protected canonical-JSON records
# occurs in a document. Asking that one pattern at a time costs corpus bytes
# times pattern count, which measured at 73 percent of `prepare-corpus`. The
# patterns run from 2 bytes to 197,766, so no fixed window or prefix anchor
# separates them; Aho-Corasick answers all of them in one pass over the document
# and is exactly the substring test the loop it replaces performed. Pure Rust,
# already resolved in `Cargo.lock`, and on the data lane rather than behind an
# accelerator feature.
aho-corasick = "1.1"
anyhow = { version = "1.0", optional = true }
burn = { version = "=0.21.0", default-features = false, features = ["std"], optional = true }
# BalancedCheckpointing is not re-exported through the burn facade, so the
# autodiff crate is a direct dependency of every accelerator boundary.
burn-autodiff = { version = "=0.21.0", default-features = false, optional = true }
clap = { version = "4.5", features = ["derive"] }
# Governed acquisition. `AGENTS.md` requires the contract's HTTPS and redirect
# rules and `docs/rebuild-contract.md:109` marks HTTPS/checksums/credentials
# REIMPLEMENT, so these belong to the data lane rather than to an accelerator
# feature. `ureq` is blocking and rustls-backed, which avoids pulling a tokio
# runtime into a pipeline that has no other async. `flate2` covers the gzip that
# DECONTAM-001 requires for the pinned `.jsonl.gz` benchmark assets. Both, and
# every crate they need, were already resolved in `Cargo.lock` through the
# accelerator tree, so naming them directly adds edges without version churn.
flate2 = "1.1"
half = { version = "2.7", optional = true }
hex = "0.4"
# `SOURCE-001` makes the primary source The Stack v2's Python *metadata* plus
# authorized Software Heritage content, and that metadata is distributed as
# Parquet holding Software Heritage identifiers rather than code
# (`docs/rebuild-contract.md:111,151`). Reading it needs a Parquet reader.
#
# Unlike the other data-lane crates this one was not already resolved, so it is
# the first addition that genuinely widens the tree, and the features are chosen
# to widen it as little as the format allows. `default-features = false` drops
# the async runtime, the object store and every cloud transport: the shards
# arrive as local hash-bound bytes from `fetch`, so this crate only decodes them.
#
# The codec set is pure Rust on purpose. `CLAUDE.md` permits exactly one piece of
# native code on the data lane — the pinned tree-sitter C parser — and Parquet's
# `zstd` feature would bring `zstd-sys` with it. That crate is already in
# `Cargo.lock` via `zip` in the accelerator tree, but that tree is feature-gated
# and never compiles into a CPU or data build; enabling it here would put C into
# the default build. A shard in an unsupported codec therefore fails with a typed
# error naming the codec rather than being silently unreadable.
parquet = { version = "56", default-features = false, features = [
    "arrow",
    "snap",
    "flate2",
    "flate2-rust_backened",
    "lz4",
    "brotli",
] }
arrow-array = { version = "56", default-features = false }
arrow-schema = { version = "56", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Software Heritage addresses content by `sha1_git`, so resolving an identifier
# to bytes and proving they are the ones the shard named needs Git's blob
# identity, not SHA-256. Already resolved in `Cargo.lock`, pure Rust, and used
# only for that check — never for an artifact digest, which stays SHA-256.
sha1 = "0.10"
sha2 = "0.10"
rand_chacha = "=0.10.0"
rand_core = "0.10"
rand = "0.10"
rand_distr = "=0.6.0"
tree-sitter = "=0.25.8"
tree-sitter-python = "=0.25.0"
ureq = "2.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.22"
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
