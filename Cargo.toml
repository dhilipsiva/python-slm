[workspace]
members = [".", "xtask"]
resolver = "3"

[package]
name = "rust-llm-pretrain"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Zero-Python Rust scaffold for the python-slm rebuild"
license = "Apache-2.0 OR MIT"

[[bin]]
name = "python-slm"
path = "src/main.rs"

[features]
default = ["cpu-reference"]
# The CPU feature is intentionally dependency-free until its owning phases land.
cpu-reference = []
# The P2/P10 accelerator boundary; P18 reuses it for the Linux/NVIDIA lane.
cuda = [
    "dep:anyhow",
    "dep:burn",
    "dep:burn-autodiff",
    "burn/cuda",
    "burn/autodiff",
    "burn/fusion",
    "burn/autotune",
    "dep:half",
]
# P18 Linux/AMD ROCm/HIP adapter boundary; compiles only where the HIP SDK exists.
rocm = [
    "dep:anyhow",
    "dep:burn",
    "dep:burn-autodiff",
    "burn/rocm",
    "burn/autodiff",
    "burn/fusion",
    "burn/autotune",
    "dep:half",
]
# P18 macOS/Apple Silicon Metal adapter boundary; compiles only on macOS hosts.
metal = [
    "dep:anyhow",
    "dep:burn",
    "dep:burn-autodiff",
    "burn/metal",
    "burn/autodiff",
    "burn/fusion",
    "burn/autotune",
    "dep:half",
]

[dependencies]
# `DECONTAM-001` asks whether any of a thousand protected canonical-JSON records
# occurs in a document. Asking that one pattern at a time costs corpus bytes
# times pattern count, which measured at 73 percent of `prepare-corpus`. The
# patterns run from 2 bytes to 197,766, so no fixed window or prefix anchor
# separates them; Aho-Corasick answers all of them in one pass over the document
# and is exactly the substring test the loop it replaces performed. Pure Rust,
# already resolved in `Cargo.lock`, and on the data lane rather than behind an
# accelerator feature.
aho-corasick = "1.1"
anyhow = { version = "1.0", optional = true }
burn = { version = "=0.21.0", default-features = false, features = ["std"], optional = true }
# BalancedCheckpointing is not re-exported through the burn facade, so the
# autodiff crate is a direct dependency of every accelerator boundary.
burn-autodiff = { version = "=0.21.0", default-features = false, optional = true }
clap = { version = "4.5", features = ["derive"] }
# Governed acquisition. `AGENTS.md` requires the contract's HTTPS and redirect
# rules and `docs/rebuild-contract.md:109` marks HTTPS/checksums/credentials
# REIMPLEMENT, so these belong to the data lane rather than to an accelerator
# feature. `ureq` is blocking and rustls-backed, which avoids pulling a tokio
# runtime into a pipeline that has no other async. `flate2` covers the gzip that
# DECONTAM-001 requires for the pinned `.jsonl.gz` benchmark assets. Both, and
# every crate they need, were already resolved in `Cargo.lock` through the
# accelerator tree, so naming them directly adds edges without version churn.
flate2 = "1.1"
half = { version = "2.7", optional = true }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rand_chacha = "=0.10.0"
rand_core = "0.10"
rand = "0.10"
rand_distr = "=0.6.0"
tree-sitter = "=0.25.8"
tree-sitter-python = "=0.25.0"
ureq = "2.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.22"
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
