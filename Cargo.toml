[workspace]
members = [".", "xtask"]
resolver = "3"

[package]
name = "rust-llm-pretrain"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Zero-Python Rust scaffold for the python-slm rebuild"
license = "Apache-2.0 OR MIT"

[[bin]]
name = "python-slm"
path = "src/main.rs"

[features]
default = ["cpu-reference"]
# The CPU feature is intentionally dependency-free until its owning phases land.
cpu-reference = []
# The sole implemented accelerator boundary retained from P2.
cuda = [
    "dep:anyhow",
    "dep:burn",
    "burn/cuda",
    "burn/autodiff",
    "burn/fusion",
    "burn/autotune",
    "dep:half",
]

[dependencies]
anyhow = { version = "1.0", optional = true }
burn = { version = "=0.21.0", default-features = false, features = ["std"], optional = true }
clap = { version = "4.5", features = ["derive"] }
half = { version = "2.7", optional = true }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rand_chacha = "=0.10.0"
rand_core = "0.10"
rand = "0.10"
rand_distr = "=0.6.0"
tree-sitter = "=0.25.8"
tree-sitter-python = "=0.25.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
base64 = "0.22"
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
