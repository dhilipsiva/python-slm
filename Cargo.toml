[workspace]
members = [".", "xtask"]
resolver = "3"

[package]
name = "rust-llm-pretrain"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Zero-Python Rust scaffold for the python-slm rebuild"
license = "Apache-2.0 OR MIT"

[[bin]]
name = "python-slm"
path = "src/main.rs"

[features]
default = ["cpu-reference"]
# The CPU feature is intentionally dependency-free until its owning phases land.
cpu-reference = []
# The sole implemented accelerator boundary retained from P2.
cuda = [
    "dep:anyhow",
    "dep:burn",
    "burn/cuda",
    "burn/autodiff",
    "burn/fusion",
    "burn/autotune",
    "dep:half",
    "dep:hex",
]

[dependencies]
anyhow = { version = "1.0", optional = true }
burn = { version = "=0.21.0", default-features = false, features = ["std"], optional = true }
clap = { version = "4.5", features = ["derive"] }
half = { version = "2.7", optional = true }
hex = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
